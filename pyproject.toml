[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honda-generator-ble"
version = "0.1.0"
description = "Interoperability client and protocol docs for Honda inverter generator BLE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["honda", "generator", "bluetooth", "ble", "eu7000is", "off-grid"]
dependencies = ["bleak>=0.21"]

[project.urls]
Homepage = "https://github.com/CedarBlocks/honda-generator-ble"
Documentation = "https://github.com/CedarBlocks/honda-generator-ble/blob/main/docs/PROTOCOL.md"

[tool.setuptools.packages.find]
include = ["honda_generator_ble*"]
